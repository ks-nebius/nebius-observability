name: "Upload Dashboards"

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: [ "dashboards/**" ]

jobs:
  upload_dashboards:
    runs-on: ubuntu-latest
    container:
      image: "${{ vars.NEBIUS_DASHBOARD_TOOLS_IMAGE }}"
      credentials:
        username: iam
        password: "${{ secrets.NEBIUS_CONTAINER_REGISTRY_STATIC_KEY_TOKEN }}"
      env:
        DASHBOARDS_FOLDER: dashboards
        S3_ENDPOINT: "${{ vars.NEBIUS_DASHBOARDS_S3_ENDPOINT }}"
        S3_BUCKET: "${{ vars.NEBIUS_DASHBOARDS_S3_BUCKET }}"
        S3_ACCESS_KEY_ID: "${{ vars.NEBIUS_DASHBOARDS_S3_ACCESS_KEY_ID }}"
        S3_SECRET_ACCESS_KEY: "${{ secrets.NEBIUS_DASHBOARDS_S3_ACCESS_KEY_SECRET }}"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Upload dashboards
        run: "/tools/.venv/bin/python /tools/upload_dashboards.py"
